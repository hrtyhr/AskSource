spring:
  datasource:
    url: jdbc:h2:mem:aiupweb-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6380
      client-type: jedis
      repositories:
        enabled: false
  ai:
    openai:
      api-key: not-configured
      base-url: http://127.0.0.1:9090/v1
      chat:
        model: qwen-plus
      embedding:
        model: text-embedding-v4
        dimensions: 1024
    vectorstore:
      redis:
        initialize-schema: false
  thymeleaf:
    cache: false

app:
  ai:
    enabled: true
    indexing-enabled: false
    recover-on-startup: false
    embedding-dimensions: 1024
    chunk-size: 800
    chunk-overlap: 120
  seed:
    enabled: false
  demo:
    admin-password: Admin@123456
    password: Demo@123456

logging:
  level:
    root: WARN
    com.itheima.aiupweb: INFO
