<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${mode == 'create' ? '发布帖子' : '编辑帖子'})}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main class="page">
    <div class="container" style="max-width: 920px;">
        <div class="page-head">
            <div>
                <h1 th:text="${mode == 'create' ? '发布技术帖' : '编辑帖子'}">发布技术帖</h1>
                <p>描述清楚技术栈、问题和尝试过的方案，更容易获得有效讨论。</p>
            </div>
            <a class="btn btn-ghost" th:href="${mode == 'create'} ? @{/posts} : @{/posts/{id}(id=${postId})}">取消</a>
        </div>

        <div th:if="${formError}" class="form-error-banner" th:text="${formError}">表单错误</div>

        <div class="form-card">
            <form th:action="${mode == 'create'} ? @{/posts} : @{/posts/{id}/edit(id=${postId})}"
                  th:object="${postForm}" method="post">
                <div class="field">
                    <label for="title">标题</label>
                    <input class="input" id="title" type="text" th:field="*{title}"
                           placeholder="用一句话描述问题或实践主题" maxlength="120" required>
                    <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">错误</div>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label for="categoryId">分类</label>
                        <select class="select" id="categoryId" th:field="*{categoryId}" required>
                            <option value="">请选择分类</option>
                            <option th:each="category : ${categories}" th:value="${category.id}"
                                    th:text="${category.name}">分类</option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('categoryId')}"
                             th:errors="*{categoryId}">错误</div>
                    </div>
                    <div class="field">
                        <label for="tags">标签</label>
                        <input class="input" id="tags" type="text" th:field="*{tags}"
                               placeholder="用逗号分隔，最多 5 个">
                        <div class="hint">例如：Spring AI, RAG, 向量检索</div>
                        <div class="field-error" th:if="${#fields.hasErrors('tags')}" th:errors="*{tags}">错误</div>
                    </div>
                </div>

                <div class="field">
                    <label for="content">正文（支持 Markdown）</label>
                    <textarea class="textarea textarea-lg" id="content" th:field="*{content}"
                              placeholder="补充问题背景、环境版本、代码片段和已尝试的方案..." required></textarea>
                    <div class="hint">代码请使用 ```语言 包裹；支持表格、列表和链接。内容会经过安全清洗后展示。</div>
                    <div class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">错误</div>
                </div>

                <div class="form-actions">
                    <a class="btn btn-ghost" th:href="${mode == 'create'} ? @{/posts} : @{/posts/{id}(id=${postId})}">取消</a>
                    <button class="btn btn-primary" type="submit"
                            th:text="${mode == 'create' ? '发布帖子' : '保存修改'}">发布帖子</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
