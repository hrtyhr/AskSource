<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('登录')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main class="login-shell">
    <div class="container">
        <div class="auth-card">
            <span class="eyebrow">WELCOME BACK</span>
            <h1>登录 AskSource</h1>
            <p class="sub">继续参与技术讨论，向社区 AI 助手提问。</p>

            <div th:if="${param.error}" class="form-error-banner">用户名或密码错误，或账号已被禁用。</div>
            <div th:if="${param.registered}" class="flash flash-success" style="margin-bottom: 16px;">注册成功，请登录。</div>
            <div th:if="${param.logout}" class="flash flash-success" style="margin-bottom: 16px;">你已安全退出。</div>

            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="username">用户名</label>
                    <input class="input" id="username" type="text" name="username" autocomplete="username"
                           autofocus required placeholder="请输入用户名">
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input class="input" id="password" type="password" name="password"
                           autocomplete="current-password" required placeholder="请输入密码">
                </div>
                <button class="btn btn-primary btn-block" type="submit">登录</button>
            </form>

            <p class="auth-foot">还没有账号？<a th:href="@{/register}">创建一个</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
